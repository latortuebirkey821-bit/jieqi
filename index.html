            background-size: 80px 80px, 120px 120px, 150px 150px, cover;
            position: relative;
        }

        /* 悬挂灯笼装饰 */
        body::before {
            content: "🏮🏮🏮🏮🏮🏮🏮🏮";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            font-size: 4rem;
            color: #ffdd88;
            text-shadow: 0 0 10px #ffb347;
            letter-spacing: 20px;
            white-space: nowrap;
            opacity: 0.25;
            transform: rotate(-2deg);
            pointer-events: none;
            z-index: 1;
            animation: swingLights 6s infinite alternate;
        }

        @keyframes swingLights {
            0% { transform: rotate(-3deg) translateY(0); }
            100% { transform: rotate(3deg) translateY(10px); }
        }

        /* 页面切换 */
        .page {
            position: relative;
            z-index: 20;
            min-height: 100vh;
            padding: 1.5rem 1rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.4s ease;

        .hidden-page {
            display: none !important;
        }

        /* ---------- 登录页样式 ---------- */
        .login-container {

            background: rgba(255, 245, 220, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 100px 100px 60px 60px;
            border: 8px solid #fff8e0;
            box-shadow: 0 30px 0 #a1421f, 0 40px 50px -10px #380000;
            padding: 2.5rem 2rem 3rem;
            text-align: center;
            transform: rotate(-0.5deg);

        .totem-item {

            border: 4px solid white;

        .sub-title {
            font-size: 2.4rem;
            background: #f9d67a;
            color: #7b2c1a;
            display: inline-block;
            padding: 0.5rem 2.2rem;
            border-radius: 60px;
            border: 5px solid #fff0b5;
            box-shadow: 0 8px 0 #b95727;
            margin: 1.2rem 0;
            font-weight: bold;
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin: 2rem 0;
        }

            background: #cbe6d9;
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            border: 4px solid white;
            box-shadow: 0 5px 0 #7b935e;
            color: #224411;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .mini-tag {
            background: #fedb9f;
            padding: 0.3rem 1rem;
            border-radius: 30px;
            font-size: 1.2rem;
            border: 3px solid white;
            box-shadow: 0 3px 0 #b25623;
        }

        .explore-btn {
            background: #ffbb77;
            border: none;
            font-size: 4rem;
            font-weight: bold;
            color: #642a10;
            padding: 1.2rem 2.5rem 1.8rem;
            border-radius: 120px;
            border: 8px solid white;
            box-shadow: 0 20px 0 #a64b22, 0 30px 30px #3e0000;
            cursor: pointer;
            transition: 0.1s ease;
            margin-top: 1.5rem;

        }

            display: inline-block;
            border: 3px solid #ffc489;
        }

            box-shadow: 0 4px 0 #a64b22;
        }

            transform: translateY(4px);

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.2rem 1rem;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            perspective: 1000px;
        }

        .flip-card {
            background-color: transparent;
            height: 320px;
            cursor: pointer;
            border-radius: 40px 40px 25px 25px;
            box-shadow: 0 10px 0 #9f3a1b, 0 15px 20px -5px #2d0000;
            transition: box-shadow 0.2s;
        }

        .flip-card:hover {
            box-shadow: 0 12px 0 #8b2f12, 0 18px 22px -4px #1f0000;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.4s ease;
            transform-style: preserve-3d;
            border-radius: 40px 40px 25px 25px;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 40px 40px 25px 25px;
            padding: 0.8rem 0.8rem 0.6rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 4px solid #fffde7;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.05);
            overflow-y: auto;
        }

        .card-front {
            background: inherit;
            transform: rotateY(0deg);
        }

        .card-back {
            background: #fef7e9;
            transform: rotateY(180deg);
            border: 5px solid #fdc68b;
            justify-content: flex-start;
        }

        .card-atmosphere {
            position: absolute;
            bottom: 0;
            right: 0;
            font-size: 4.5rem;
            opacity: 0.2;
            z-index: 1;
            pointer-events: none;
        }

            box-shadow: 0 0 0 3px #ffd966, 0 0 10px 3px #ffb347, 0 10px 0 #9f3a1b !important;

            from { box-shadow: 0 0 0 3px #ffd966, 0 0 8px 2px #ffae42, 0 10px 0 #9f3a1b; }
            to { box-shadow: 0 0 0 6px #ffeeaa, 0 0 15px 5px #ff9100, 0 10px 0 #9f3a1b; }

            position: absolute;
            top: 5px;
            left: 5px;
            font-size: 1.8rem;
            animation: flutter 1.5s infinite;
            z-index: 40;
            pointer-events: none;

        }

        @keyframes flutter {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-4px) rotate(5deg); }
            100% { transform: translateY(0) rotate(0deg); }

            font-weight: bold;

            background: #9f412a;
            padding: 0.2rem 1.2rem;
            border-radius: 30px;
            margin-top: 0.5rem;
        }
    </style>

                    month: "八月", monthEn: "August", lunar: "农历七月/八月", 
                    terms: ["立秋", "处暑"], special: "中秋节",
                    food: "🥮 月饼", foodIcon: "🥮", totem: "玉兔", totemIcon: "🐇",
                    pinyin: "中(zhōng)秋(qiū) 立(lì)秋(qiū)",
                    backPoem: "《静夜思》—— 床前明月光，疑是地上霜。", 
                    custom: "🌕 中秋赏月·吃月饼，贴秋膘",
                    atmosphereColor: "#efc7a6", 
                    bgImage: "radial-gradient(circle at 30% 40%, #ffdba5, #fbdead)", 
                    atmosphereIcon: "🌕" 
                },
                { // 九月
                    month: "九月", monthEn: "September", lunar: "农历八月/九月", 
                    terms: ["白露", "秋分"], special: null,
                    food: "🍐 秋梨", foodIcon: "🍐", totem: "大雁", totemIcon: "🦅",
                    pinyin: "白(bái)露(lù) 秋(qiū)分(fēn)",
                    backPoem: "《秋风词》—— 秋风清，秋月明，落叶聚还散。", 
                    custom: "🍂 白露饮米酒，秋分吃秋菜",
                    atmosphereColor: "#cbb89e", 
                    bgImage: "radial-gradient(circle at 70% 80%, #eeddbb, transparent)", 
                    atmosphereIcon: "🍁" 
                },
                { // 十月
                    month: "十月", monthEn: "October", lunar: "农历八月/九月", 
                    terms: ["寒露", "霜降"], special: "重阳节",
                    food: "🍰 重阳糕", foodIcon: "🍰", totem: "菊花", totemIcon: "🌼",
                    pinyin: "重(chóng)阳(yáng) 霜(shuāng)降(jiàng)",
                    backPoem: "《九月九日忆山东兄弟》—— 独在异乡为异客，每逢佳节倍思亲。", 
                    custom: "🏔️ 重阳登高·插茱萸，霜降柿子红",
                    atmosphereColor: "#dbba8c", 
                    bgImage: "linear-gradient(145deg, #fde6b1, #f4ca9b)", 
                    atmosphereIcon: "🏔️" 
                },
                { // 十一月
                    month: "十一月", monthEn: "November", lunar: "农历九月/十月", 
                    terms: ["立冬", "小雪"], special: null,
                    food: "🥟 饺子", foodIcon: "🥟", totem: "松鼠", totemIcon: "🐿️",
                    pinyin: "立(lì)冬(dōng) 小(xiǎo)雪(xuě)",
                    backPoem: "《立冬》—— 冻笔新诗懒写，寒炉美酒时温。", 
                    custom: "❄️ 立冬吃饺子，小雪腌菜",
                    atmosphereColor: "#b7cfda", 
                    bgImage: "radial-gradient(circle at 10% 30%, #c3e0ed, transparent)", 
                    atmosphereIcon: "🥟" 
                },
                { // 十二月
                    month: "十二月", monthEn: "December", lunar: "农历十月/十一月", 
                    terms: ["大雪", "冬至"], special: "冬至",
                    food: "🍲 羊肉汤", foodIcon: "🍲", totem: "冬眠熊", totemIcon: "🐻",
                    pinyin: "冬(dōng)至(zhì) 大(dà)雪(xuě)",
                    backPoem: "《冬至》—— 邯郸驿里逢冬至，抱膝灯前影伴身。", 
                    custom: "⛄️ 冬至吃汤圆，大雪腌肉",
                    atmosphereColor: "#b0ccda", 
                    bgImage: "radial-gradient(circle at 80% 20%, #ceecf0, #b4d3e0)", 
                    atmosphereIcon: "⛄️" 
                }
            ];

            const grid = document.getElementById('monthGrid');

            function renderCards() {
                grid.innerHTML = '';
                monthsData.forEach((m, idx) => {
                    const flipCard = document.createElement('div');
                    flipCard.className = 'flip-card';
                    if (idx === currentMonthIndex) flipCard.classList.add('current-month-highlight');

                    const inner = document.createElement('div');
                    inner.className = 'flip-card-inner';

                    const front = document.createElement('div');
                    front.className = 'card-front';
                    front.style.background = `${m.atmosphereColor} ${m.bgImage}`;
                    front.style.backgroundBlendMode = 'overlay';

                    if (idx === currentMonthIndex) {
                        const butterfly = document.createElement('div');
                        butterfly.className = 'butterfly-float';
                        butterfly.innerText = '🦋';
                        front.appendChild(butterfly);
                    }

                    const atmos = document.createElement('div');
                    atmos.className = 'card-atmosphere';
                    atmos.innerText = m.atmosphereIcon;
                    front.appendChild(atmos);

                    front.innerHTML += `
                        <div class="month-badge">${m.month} · ${m.monthEn}</div>
                        <div class="pinyin-box"><ruby>${m.pinyin}<rt>注音</rt></ruby></div>
                        <div class="lunar-text">${m.lunar}</div>
                        <div class="term-icons">
                            ${m.terms.map(t => `<div class="term-icon"><span>🍃</span>${t}</div>`).join('')}
                        </div>
                        ${m.special ? `<div class="special-event">🎊 ${m.special} 🎊</div>` : ''}
                        <div class="season-totem">${m.totemIcon} ${m.totem}</div>
                        <div class="food-item">${m.foodIcon} ${m.food}</div>
                    `;

                    const back = document.createElement('div');
                    back.className = 'card-back';
                    back.innerHTML = `
                        <div class="back-title">📜 节气小诗</div>
                        <div class="back-poem">${m.backPoem}</div>
                        <div class="back-title">🎐 小习俗</div>
                        <div class="food-item" style="background:#fadcd9; margin-top:0.2rem;">${m.custom}</div>
                        <div style="margin-top:0.4rem; font-size:1.5rem;">${m.totemIcon}</div>
                        <p style="font-size:0.8rem; margin-top:0.2rem;">✨ 翻回去 ✨</p>
                    `;

                    inner.appendChild(front);
                    inner.appendChild(back);
                    flipCard.appendChild(inner);
                    grid.appendChild(flipCard);

                    flipCard.addEventListener('click', (e) => {
                        flipCard.classList.toggle('flipped');
                    });
                });
            }

            renderCards();
        })();
    </script>
</body>
</html>
